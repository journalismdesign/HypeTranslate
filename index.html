<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Littératie du hype — Synth</title>
  <meta name="description" content="Parcours en français pour couvrir l'intelligence artificielle sans amplifier le hype. Adaptation Synth du cours Hype Literacy de la DW Akademie.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="assets/mark-eye-cyan.png" type="image/png">
  <script>
    /* Thème appliqué avant l'affichage, pour éviter un flash (clé partagée par les long formats Synth) */
    try { var t = localStorage.getItem('synth-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/synth-header.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#contenu">Aller au contenu</a>

  <div class="sh-progress" aria-hidden="true"><div class="sh-progress-fill" id="progressFill"></div></div>

  <header class="sh-site" id="siteHeader">
    <div class="sh-row">
      <div class="sh-left">
        <button class="sh-btn menu-toggle" type="button" aria-controls="sommaire" aria-expanded="false" aria-label="Ouvrir le sommaire">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"/></svg>
        </button>
        <a class="sh-logo" href="https://synthmedia.fr/" target="_blank" rel="noopener">
          <img src="assets/logo-synth-white-cyan.png" alt="Synth." width="81" height="24">
        </a>
      </div>
      <div class="sh-controls">
        <a class="sh-tag" href="#/accueil">Littératie du hype</a>
        <button class="sh-btn sh-theme show-moon" id="themeToggle" type="button" aria-label="Basculer entre thème clair et sombre">
          <svg class="icon icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.6"/><path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <svg class="icon icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 14.2A8.5 8.5 0 1 1 9.8 4a6.7 6.7 0 0 0 10.2 10.2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="layout">
    <nav id="sommaire" class="sidebar" aria-label="Sommaire">
      <div class="course-progress" role="progressbar" aria-label="Progression du parcours" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span class="course-progress-label">Progression <b class="course-progress-count">0 / 0</b></span>
        <span class="course-progress-track"><span class="course-progress-bar"></span></span>
      </div>
      <ol class="toc"></ol>
      <button class="reset" type="button">Réinitialiser ma progression</button>
    </nav>

    <main id="contenu" class="content" tabindex="-1">
      <p class="loading">Chargement du parcours…</p>
    </main>
  </div>

  <footer class="footer">
    <p class="footer-tagline">Clarifier les enjeux du présent technologique</p>
    <p>Une adaptation <strong>Synth.</strong> d'après le cours <em>Hype Literacy</em> de la DW Akademie et de Hype Studies.</p>
    <img class="footer-mark" src="assets/mark-eye-cyan.png" alt="" aria-hidden="true">
  </footer>

  <script src="js/vendor/gsap.min.js"></script>
  <script src="js/vendor/Draggable.min.js"></script>
  <script src="js/synth-header.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/atelier.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
